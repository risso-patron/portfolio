name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Verifica que los archivos JS del servidor no tengan errores de sintaxis.
      # node --check analiza sin ejecutar — falla si hay un SyntaxError real.
      - name: Syntax check — API & scripts
        run: npm run check

      # Genera dist/ (ES/EN, casos, sitemap) y falla si hay claves i18n
      # desparejas, enlaces/anclas rotos o marcadores sin resolver.
      - name: Build static site
        run: npm run build

      # Verifica que los archivos críticos del portfolio existen tras el build.
      - name: Required files present
        run: |
          for f in dist/index.html dist/en.html dist/sitemap.xml dist/assets/css/main.css dist/assets/js/main.js api/weather.js api/forecast.js api/giphy.js; do
            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "All required files present"
          # Ningún archivo interno debe llegar a dist/.
          for f in dist/clients dist/openspec dist/test-cards.html dist/budget-app; do
            [ ! -e "$f" ] || { echo "LEAKED: $f"; exit 1; }
          done